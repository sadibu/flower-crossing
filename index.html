<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ein Zebrastreifen von oben, auf dem Passanten mit Blumenköpfen gehen.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Zebrastreifen in Blüte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed canvas of wet city asphalt seen from above; a small title card and a control strip float over it. Single dark look by choice. */
:root {
  --asphalt: #3b3f3e;
  --ink: #f3f1ea;
  --ink-dim: #b9bcb6;
  --glass: rgba(22, 25, 25, 0.72);
  --line: rgba(243, 241, 234, 0.14);
  --go: #46d17a;
  --stop: #ff5a4e;
  --bloom: #e38fd0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--asphalt);
  color: var(--ink);
  font-family: var(--display);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#street { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: crosshair; }
#street.on-flower { cursor: pointer; }

.overlay {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card, .controls {
  pointer-events: auto;
  background: var(--glass);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card { align-self: flex-start; max-width: min(340px, 100%); padding: 14px 16px 15px; display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
h1 { margin: 0; font-weight: 800; font-size: clamp(24px, 4.2vw, 34px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--bloom); }
.card p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-dim); font-weight: 500; }
.card button.hide { justify-self: start; margin-top: 2px; }

.controls {
  align-self: center; max-width: 100%;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px;
  padding: 8px;
}
button, .speed {
  font: 500 13px/1 var(--mono);
  color: var(--ink);
  background: rgba(243, 241, 234, 0.06);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 13px;
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer;
}
button:hover { background: rgba(243, 241, 234, 0.13); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--bloom); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(243, 241, 234, 0.18); border-color: rgba(243, 241, 234, 0.35); }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--go); box-shadow: 0 0 10px var(--go); }
.red .lamp { background: var(--stop); box-shadow: 0 0 10px var(--stop); }
.speed { cursor: default; }
.speed input { width: 92px; accent-color: var(--bloom); }
.count { font: 400 12px/1 var(--mono); color: var(--ink-dim); padding: 0 6px; font-variant-numeric: tabular-nums; }
.card.collapsed p, .card.collapsed .eyebrow { display: none; }

@media (max-width: 520px) {
  .speed input { width: 70px; }
  .count { width: 100%; text-align: center; padding-top: 2px; }
}
</style>
</head>
<body>
<canvas id="street" aria-label="Ein Zebrastreifen von oben, auf dem Menschen mit Blumenköpfen gehen"></canvas>

<div class="overlay">
  <section class="card" id="card">
    <span class="eyebrow">Fußgängerüberweg · von oben</span>
    <h1>Zebrastreifen in <em>Blüte</em></h1>
    <p>Tippe eine Blüte an, um sie zu tauschen. Tippe auf den Asphalt, damit jemand Neues losgeht. Leertaste schaltet die Ampel.</p>
  </section>

  <div class="controls" role="toolbar" aria-label="Steuerung">
    <button id="light" type="button" aria-pressed="false"><span class="lamp"></span><span id="lightLabel">Ampel: Grün</span></button>
    <button id="rain" type="button" aria-pressed="false">Regen</button>
    <label class="speed" for="tempo">Tempo <input id="tempo" type="range" min="0.2" max="2.2" step="0.1" value="1"></label>
    <button id="rebloom" type="button">Alle neu erblühen</button>
    <span class="count" id="count"></span>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('street');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;

  let W = 0, H = 0, DPR = 1, U = 50;
  let bg = null;
  let walkers = [], petals = [], drops = [], ripples = [];
  let green = true, raining = false, wet = 0, tempo = reduce ? 0.5 : 1;
  let pointer = { x: -1e4, y: -1e4 }, hovered = null;
  let t = 0;
  const STRIPE_ANGLE = 0.16;

  // ---------- Blumen ----------
  function petalPath(c, len, w, sharp) {
    const cy = sharp ? 0.5 : 0.92;
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(w * 0.85, -len * 0.12, w * 1.05, -len * cy, 0, -len);
    c.bezierCurveTo(-w * 1.05, -len * cy, -w * 0.85, -len * 0.12, 0, 0);
    c.closePath();
  }
  function radial(c, r, stops) {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  }
  function dot(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = col; c.fill(); }

  const FLOWERS = [
    { key: 'pansy', name: 'Stiefmütterchen', pals: [
      ['#4b2a8c', '#f2c230', '#2a0f3a', '#ffe066'], ['#1f2f9c', '#f4f2ff', '#1a1f5c', '#ffd84a'],
      ['#f5b400', '#f7c21a', '#6b3300', '#ffe680'], ['#e889b8', '#f6c8dd', '#3a1430', '#ffd84a'],
      ['#8a6bd1', '#f0d070', '#20102a', '#ffd84a']],
      draw(c, r, p) {
        const [top, side, face, eye] = p;
        c.fillStyle = top;
        dot(c, -0.36 * r, -0.42 * r, 0.56 * r, top); dot(c, 0.36 * r, -0.42 * r, 0.56 * r, top);
        c.fillStyle = side;
        dot(c, -0.56 * r, 0.12 * r, 0.46 * r, side); dot(c, 0.56 * r, 0.12 * r, 0.46 * r, side);
        dot(c, 0, 0.42 * r, 0.58 * r, side);
        c.save(); c.globalAlpha = 0.9;
        c.fillStyle = radial(c, 0.62 * r, [[0, face], [0.55, face], [1, 'rgba(0,0,0,0)']]);
        c.beginPath(); c.arc(0, 0.12 * r, 0.62 * r, 0, TAU); c.fill(); c.restore();
        c.strokeStyle = face; c.lineWidth = r * 0.03; c.globalAlpha = 0.6;
        for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(0, 0.05 * r); c.lineTo(i * 0.16 * r, 0.75 * r); c.stroke(); }
        c.globalAlpha = 1;
        dot(c, 0, 0.04 * r, 0.12 * r, eye);
      } },
    { key: 'hibiscus', name: 'Hibiskus', pals: [
      ['#f4a6e0', '#b257db', '#4e0e58'], ['#e8d27a', '#8a7ad8', '#3a1d58'],
      ['#ffb070', '#ff5aa0', '#7a0a36'], ['#f2ecff', '#7f6be0', '#2e0f5e']],
      draw(c, r, p, f) {
        const g = radial(c, r, [[0, p[2]], [0.28, p[1]], [0.7, p[1]], [1, p[0]]]);
        for (let i = 0; i < 5; i++) {
          c.save(); c.rotate(i * TAU / 5);
          petalPath(c, r, r * 0.66, false); c.fillStyle = g; c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = r * 0.02;
          for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(0, -0.15 * r); c.quadraticCurveTo(k * 0.12 * r, -0.6 * r, k * 0.22 * r, -0.92 * r); c.stroke(); }
          c.restore();
        }
        c.strokeStyle = '#fff2c4'; c.lineWidth = r * 0.06; c.lineCap = 'round';
        c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(0.1 * r, -0.3 * r, 0.22 * r, -0.5 * r); c.stroke();
        for (let i = 0; i < 6; i++) dot(c, 0.22 * r + Math.cos(i) * 0.07 * r, -0.5 * r + Math.sin(i * 2) * 0.06 * r, 0.035 * r, '#ffd23a');
      } },
    { key: 'orchid', name: 'Orchidee', pals: [
      ['#2f5be0', '#132a86', '#ffffff'], ['#eed6ff', '#b070e0', '#ffd040'], ['#fbfbff', '#e070b0', '#d63a7a']],
      draw(c, r, p) {
        const g = radial(c, r, [[0, p[1]], [0.25, p[1]], [0.75, p[0]], [1, p[0]]]);
        [0, 2.25, -2.25].forEach(a => { c.save(); c.rotate(a); petalPath(c, 0.98 * r, 0.33 * r, false); c.fillStyle = g; c.fill(); c.restore(); });
        [1.3, -1.3].forEach(a => { c.save(); c.rotate(a); petalPath(c, 0.86 * r, 0.6 * r, false); c.fillStyle = g; c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = r * 0.02;
          for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(0, -0.1 * r); c.lineTo(k * 0.25 * r, -0.75 * r); c.stroke(); }
          c.restore(); });
        c.save(); c.rotate(Math.PI); petalPath(c, 0.48 * r, 0.24 * r, false); c.fillStyle = p[2]; c.fill(); c.restore();
        dot(c, 0, 0, 0.14 * r, '#fffbe8'); dot(c, 0, 0.06 * r, 0.06 * r, '#ffcf30');
      } },
    { key: 'daisy', name: 'Margerite', pals: [['#ffffff', '#f0b81a'], ['#fff6e8', '#e89a10']],
      draw(c, r, p, f) {
        const n = 22;
        for (let i = 0; i < n; i++) {
          c.save(); c.rotate(i * TAU / n + Math.sin(i * 7.3 + f.seed) * 0.05);
          petalPath(c, r * (0.92 + 0.08 * Math.sin(i * 3.1 + f.seed)), r * 0.14, false);
          c.fillStyle = p[0]; c.fill(); c.strokeStyle = 'rgba(80,80,60,0.18)'; c.lineWidth = r * 0.015; c.stroke(); c.restore();
        }
        c.fillStyle = radial(c, 0.32 * r, [[0, '#ffe36a'], [0.7, p[1]], [1, '#b26a00']]);
        c.beginPath(); c.arc(0, 0, 0.3 * r, 0, TAU); c.fill();
        for (let i = 0; i < 26; i++) { const a = i * 2.4, d = Math.sqrt(i / 26) * 0.26 * r; dot(c, Math.cos(a) * d, Math.sin(a) * d, 0.022 * r, 'rgba(140,80,0,0.55)'); }
      } },
    { key: 'rose', name: 'Rose', pals: [['#d0161f', '#6e0007'], ['#f6c0c8', '#b45869'], ['#f6d34a', '#a8770c']],
      draw(c, r, p) {
        dot(c, 0, 0, 0.95 * r, p[1]);
        for (let k = 0; k < 5; k++) {
          const rr = r * (0.98 - k * 0.18);
          const g = radial(c, rr, [[0, p[1]], [0.55, p[0]], [1, p[0]]]);
          for (let j = 0; j < 5; j++) {
            c.save(); c.rotate(j * TAU / 5 + k * 0.63);
            petalPath(c, rr, rr * 0.62, false); c.fillStyle = g; c.fill();
            c.strokeStyle = p[1]; c.globalAlpha = 0.55; c.lineWidth = r * 0.025; c.stroke(); c.globalAlpha = 1;
            c.restore();
          }
        }
        c.strokeStyle = p[1]; c.lineWidth = r * 0.04;
        c.beginPath(); for (let a = 0; a < 9; a += 0.2) { const d = 0.02 * r * a; c.lineTo(Math.cos(a) * d, Math.sin(a) * d); } c.stroke();
      } },
    { key: 'lily', name: 'Lilie', pals: [['#fff8e2', '#8a1030', '#5a0020'], ['#ffe0ec', '#d0306a', '#7a0a30'], ['#fff2c0', '#e07020', '#7a2a00']],
      draw(c, r, p, f) {
        for (let i = 0; i < 6; i++) {
          c.save(); c.rotate(i * TAU / 6 + (i % 2) * 0.08);
          const len = r * (i % 2 ? 0.9 : 1);
          petalPath(c, len, r * 0.3, true);
          const g = c.createLinearGradient(0, 0, 0, -len);
          g.addColorStop(0, p[1]); g.addColorStop(0.5, p[1]); g.addColorStop(0.78, p[0]); g.addColorStop(1, p[0]);
          c.fillStyle = g; c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = r * 0.025;
          c.beginPath(); c.moveTo(0, -0.1 * r); c.lineTo(0, -len * 0.92); c.stroke();
          for (let s = 0; s < 4; s++) dot(c, ((s % 2) ? 1 : -1) * 0.07 * r, -(0.25 + s * 0.08) * r, 0.022 * r, p[2]);
          c.restore();
        }
        c.strokeStyle = '#d8e0a0'; c.lineWidth = r * 0.025;
        for (let i = 0; i < 6; i++) {
          const a = i * TAU / 6 + 0.5, x = Math.cos(a) * 0.42 * r, y = Math.sin(a) * 0.42 * r;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(x, y); c.stroke();
          c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = '#7a3a10'; c.beginPath(); c.ellipse(0, 0, 0.03 * r, 0.08 * r, 0, 0, TAU); c.fill(); c.restore();
        }
      } },
    { key: 'tulip', name: 'Tulpe', pals: [['#f6a08a', '#ffd6c4'], ['#e02848', '#ff8a98'], ['#f8dc50', '#ffaa20']],
      draw(c, r, p) {
        for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * TAU / 3);
          petalPath(c, r, r * 0.68, false);
          c.fillStyle = radial(c, r, [[0, p[1]], [0.6, p[0]], [1, p[0]]]); c.fill();
          c.strokeStyle = 'rgba(0,0,0,0.12)'; c.lineWidth = r * 0.02; c.stroke(); c.restore(); }
        for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * TAU / 3 + Math.PI / 3);
          petalPath(c, 0.72 * r, r * 0.5, false);
          c.fillStyle = radial(c, 0.72 * r, [[0, '#3a2a20'], [0.25, p[1]], [1, p[0]]]); c.fill(); c.restore(); }
        dot(c, 0, 0, 0.12 * r, '#2a2018');
        for (let i = 0; i < 6; i++) dot(c, Math.cos(i * TAU / 6) * 0.15 * r, Math.sin(i * TAU / 6) * 0.15 * r, 0.04 * r, '#4a3020');
      } },
    { key: 'peony', name: 'Pfingstrose', pals: [['#f4b6cc', '#fff0f4'], ['#ffd2b0', '#fff6ec'], ['#f5d6e8', '#ffffff']],
      draw(c, r, p) {
        for (let k = 0; k < 6; k++) {
          const rr = r * (1 - k * 0.14);
          const n = 8 - (k >> 1);
          const g = radial(c, rr, [[0, '#e6c070'], [0.3, p[0]], [0.85, p[1]], [1, p[1]]]);
          for (let j = 0; j < n; j++) { c.save(); c.rotate(j * TAU / n + k * 0.4);
            petalPath(c, rr, rr * 0.5, false); c.fillStyle = g; c.fill();
            c.strokeStyle = 'rgba(160,60,100,0.18)'; c.lineWidth = r * 0.015; c.stroke(); c.restore(); }
        }
        for (let i = 0; i < 9; i++) dot(c, Math.cos(i * 2.4) * 0.09 * r, Math.sin(i * 2.4) * 0.09 * r, 0.025 * r, '#f0c040');
      } },
    { key: 'iris', name: 'Iris', pals: [['#1a1840', '#2c2c80', '#ff9a1a'], ['#4a2a8a', '#6a4ac0', '#ffd040']],
      draw(c, r, p) {
        for (let i = 0; i < 3; i++) { c.save(); c.rotate(Math.PI + i * TAU / 3);
          petalPath(c, r, r * 0.52, false);
          c.fillStyle = radial(c, r, [[0, p[2]], [0.18, p[0]], [1, p[1]]]); c.fill();
          c.strokeStyle = p[2]; c.globalAlpha = 0.85;
          for (let k = -3; k <= 3; k++) { c.lineWidth = r * (k === 0 ? 0.07 : 0.018); c.beginPath(); c.moveTo(0, -0.08 * r); c.quadraticCurveTo(k * 0.08 * r, -0.4 * r, k * 0.13 * r, -(k === 0 ? 0.6 : 0.72) * r); c.stroke(); }
          c.globalAlpha = 1; c.restore(); }
        for (let i = 0; i < 3; i++) { c.save(); c.rotate(i * TAU / 3);
          petalPath(c, 0.66 * r, r * 0.34, false);
          c.fillStyle = radial(c, 0.66 * r, [[0, p[0]], [1, p[1]]]); c.fill();
          c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = r * 0.02; c.stroke(); c.restore(); }
      } },
  ];

  function newFlower(exceptKey) {
    let type;
    do { type = pick(FLOWERS); } while (type.key === exceptKey && FLOWERS.length > 1);
    return { type, pal: pick(type.pals), rot: rnd(0, TAU), seed: rnd(0, 100), size: rnd(0.9, 1.15) };
  }

  // ---------- Passanten ----------
  const COATS = ['#141516', '#18191b', '#1c1d1f', '#121314', '#202224', '#4a2a22', '#5a3b28', '#b8472a', '#3a2226', '#255a5c', '#6b4a32'];
  const PANTS = ['#121214', '#1a1b1e', '#22252c', '#2c3440', '#d6b2a6'];

  function newWalker(x, y, dir) {
    const coat = Math.random() < 0.62 ? COATS[(Math.random() * 5) | 0] : pick(COATS);
    return {
      x, y, dir: dir ?? (Math.random() < 0.55 ? -1 : 1),
      base: rnd(0.75, 1.2), v: green ? 1 : 0, phase: rnd(0, TAU),
      drift: rnd(-0.22, 0.12),
      s: rnd(0.88, 1.08), coat, pants: pick(PANTS), shoe: Math.random() < 0.2 ? '#e8e6e0' : '#0c0c0d',
      bag: Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0,
      flower: newFlower(), hover: 0, bloom: 1, spin: 0
    };
  }

  function headPos(w) { const u = U * w.s; return { x: w.x, y: w.y - 1.72 * u, r: 0.5 * u * w.flower.size }; }

  function drawWalker(w) {
    const u = U * w.s;
    const { x, y } = w;
    const move = Math.min(1, w.v);
    const sw = Math.sin(w.phase) * 0.2 * u * move;

    // Schatten (Licht von links oben)
    ctx.fillStyle = `rgba(0,0,0,${0.28 + wet * 0.1})`;
    ctx.beginPath(); ctx.ellipse(x + 0.42 * u, y + 0.02 * u, 0.62 * u, 0.2 * u, -0.25, 0, TAU); ctx.fill();

    // Beine
    ctx.lineCap = 'round';
    [[-1, sw], [1, -sw]].forEach(([side, d]) => {
      const lx = x + side * 0.13 * u;
      ctx.strokeStyle = w.pants; ctx.lineWidth = 0.17 * u;
      ctx.beginPath(); ctx.moveTo(lx, y - 0.72 * u); ctx.lineTo(lx, y - 0.08 * u + d); ctx.stroke();
      ctx.fillStyle = w.shoe;
      ctx.beginPath(); ctx.ellipse(lx, y - 0.02 * u + d, 0.1 * u, 0.07 * u, 0, 0, TAU); ctx.fill();
    });

    // Arme hinten
    ctx.strokeStyle = shade(w.coat, -12); ctx.lineWidth = 0.16 * u;
    [[-1, -sw], [1, sw]].forEach(([side, d]) => {
      ctx.beginPath(); ctx.moveTo(x + side * 0.3 * u, y - 1.42 * u); ctx.lineTo(x + side * 0.37 * u, y - 0.82 * u + d * 0.7); ctx.stroke();
    });

    // Mantel
    const g = ctx.createLinearGradient(x - 0.4 * u, y - 1.6 * u, x + 0.4 * u, y - 0.6 * u);
    g.addColorStop(0, shade(w.coat, 22)); g.addColorStop(0.55, w.coat); g.addColorStop(1, shade(w.coat, -10));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 0.24 * u, y - 1.6 * u);
    ctx.quadraticCurveTo(x - 0.38 * u, y - 1.56 * u, x - 0.36 * u, y - 1.3 * u);
    ctx.lineTo(x - 0.38 * u, y - 0.62 * u);
    ctx.quadraticCurveTo(x, y - 0.54 * u, x + 0.38 * u, y - 0.62 * u);
    ctx.lineTo(x + 0.36 * u, y - 1.3 * u);
    ctx.quadraticCurveTo(x + 0.38 * u, y - 1.56 * u, x + 0.24 * u, y - 1.6 * u);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.02 * u;
    ctx.beginPath(); ctx.moveTo(x, y - 1.5 * u); ctx.lineTo(x, y - 0.6 * u); ctx.stroke();

    // Tasche
    if (w.bag) {
      ctx.fillStyle = '#0d0d0e';
      ctx.beginPath(); ctx.roundRect(x + w.bag * 0.36 * u - 0.12 * u, y - 1.05 * u - sw * 0.3 * w.bag, 0.24 * u, 0.3 * u, 0.05 * u); ctx.fill();
    }

    // Blüte
    const h = headPos(w);
    const f = w.flower;
    const scale = w.bloom * (1 + 0.22 * w.hover);
    ctx.save();
    ctx.translate(h.x + 0.12 * h.r, h.y + 0.16 * h.r);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, h.r * 0.85 * scale, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(f.rot + Math.sin(t * 1.3 + f.seed) * 0.07 + w.spin);
    ctx.scale(scale, scale);
    f.type.draw(ctx, h.r, f.pal, f);
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = v => Math.max(0, Math.min(255, v + amt));
    return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
  }

  // ---------- Blütenblätter ----------
  function burst(x, y, r, pal, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), sp = rnd(1.2, 4.2) * U;
      petals.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rnd(0, TAU), vr: rnd(-8, 8),
        len: r * rnd(0.28, 0.5), col: pick(pal.slice(0, 2)), life: 0, max: rnd(18, 32) });
    }
    if (petals.length > 700) petals.splice(0, petals.length - 700);
  }

  function drawPetals(dt) {
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.life += dt;
      const fr = Math.pow(0.04, dt);
      p.vx *= fr; p.vy *= fr; p.vr *= fr;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = Math.max(0, 1 - p.life / p.max);
      if (a <= 0) { petals.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.6) * 0.95;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.ellipse(0, 0, p.len * 0.35, p.len * 0.6, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Asphalt ----------
  function buildBackground() {
    bg = document.createElement('canvas');
    bg.width = W * DPR; bg.height = H * DPR;
    const c = bg.getContext('2d');
    c.scale(DPR, DPR);
    c.fillStyle = '#3b3f3e'; c.fillRect(0, 0, W, H);
    // Körnung
    for (let i = 0; i < (W * H) / 30; i++) {
      c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.08)';
      c.fillRect(Math.random() * W, Math.random() * H, rnd(0.6, 1.8), rnd(0.6, 1.8));
    }
    // Flecken
    for (let i = 0; i < 18; i++) {
      const x = rnd(0, W), y = rnd(0, H), r = rnd(40, 180);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // Zebrastreifen
    c.save();
    c.translate(W / 2, H / 2); c.rotate(STRIPE_ANGLE);
    const band = Math.max(26, U * 0.95);
    const span = Math.hypot(W, H);
    for (let y = -span / 2; y < span / 2; y += band * 2) {
      const breakAt = rnd(-span * 0.1, span * 0.35);
      [[-span / 2, breakAt - band * 0.4], [breakAt + band * 0.4, span / 2]].forEach(([x0, x1]) => {
        c.fillStyle = 'rgba(232,232,226,0.82)';
        c.fillRect(x0, y, x1 - x0, band);
        // Abrieb
        for (let k = 0; k < (x1 - x0) / 3; k++) {
          c.fillStyle = `rgba(59,63,62,${rnd(0.1, 0.55)})`;
          c.fillRect(rnd(x0, x1), y + rnd(0, band), rnd(2, 14), rnd(1, 5));
        }
      });
    }
    c.restore();
  }

  function drawWires() {
    // Oberleitungen der Straßenbahn
    ctx.save();
    ctx.lineWidth = 1.4;
    [[-0.1, 0.02], [-0.1, 0.06], [0.25, 0.32]].forEach(([a, b], i) => {
      ctx.strokeStyle = 'rgba(20,22,22,0.55)';
      ctx.beginPath(); ctx.moveTo(0, H * a); ctx.lineTo(W, H * a + W * 0.42 + H * b); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.moveTo(14, H * a + 24); ctx.lineTo(W + 14, H * a + W * 0.42 + H * b + 24); ctx.stroke();
    });
    ctx.restore();
  }

  // ---------- Regen ----------
  function drawRain(dt) {
    const target = raining ? 1 : 0;
    wet = lerp(wet, target, Math.min(1, dt * 0.8));
    if (wet < 0.01) { drops.length = 0; ripples.length = 0; return; }
    const want = Math.round(wet * (W * H) / 5000);
    while (drops.length < want) drops.push({ x: rnd(-50, W), y: rnd(-H, 0), v: rnd(900, 1400), l: rnd(10, 22) });
    if (drops.length > want) drops.length = want;
    if (Math.random() < wet * dt * 30) ripples.push({ x: rnd(0, W), y: rnd(0, H), r: 0, a: 0.5 });
    ctx.save();
    ctx.lineWidth = 1;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.r += dt * 28; r.a -= dt * 0.6;
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(210,225,230,${r.a * 0.5})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.6, 0, 0, TAU); ctx.stroke();
    }
    ctx.strokeStyle = `rgba(215,228,235,${0.3 * wet})`;
    ctx.beginPath();
    for (const d of drops) {
      d.y += d.v * dt; d.x += d.v * 0.18 * dt;
      if (d.y > H) { d.y = rnd(-80, 0); d.x = rnd(-50, W); }
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * 0.18, d.y - d.l);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Setup ----------
  function populate() {
    walkers = [];
    const n = Math.max(10, Math.min(42, Math.round((W * H) / (U * U * 10))));
    for (let i = 0; i < n; i++) walkers.push(newWalker(rnd(U * 0.5, W - U * 0.5), rnd(U * 1.6, H + U * 0.4)));
    updateCount();
  }

  function resize() {
    const oldW = W, oldH = H;
    W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    cv.width = W * DPR; cv.height = H * DPR;
    U = Math.max(30, Math.min(66, Math.min(W, H) / 11));
    buildBackground();
    if (!walkers.length) populate();
    else walkers.forEach(w => { w.x *= W / oldW; w.y *= H / oldH; });
  }

  function updateCount() {
    const kinds = new Set(walkers.map(w => w.flower.type.key)).size;
    document.getElementById('count').textContent = `${walkers.length} Passanten · ${kinds} Blumenarten`;
  }

  function findWalker(px, py) {
    let best = null, bd = Infinity;
    for (const w of walkers) {
      const h = headPos(w);
      const d = Math.hypot(px - h.x, py - h.y);
      if (d < h.r * 1.15 && h.y < bd) { best = w; bd = h.y; }
    }
    // vorderste Figur (größtes y) gewinnt
    if (best) {
      const hits = walkers.filter(w => { const h = headPos(w); return Math.hypot(px - h.x, py - h.y) < h.r * 1.15; });
      best = hits.sort((a, b) => b.y - a.y)[0];
    }
    return best;
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    if (wet > 0.01) { ctx.fillStyle = `rgba(14,22,26,${0.22 * wet})`; ctx.fillRect(0, 0, W, H); }

    drawPetals(dt);

    hovered = findWalker(pointer.x, pointer.y);
    cv.classList.toggle('on-flower', !!hovered);

    for (const w of walkers) {
      w.v = lerp(w.v, green ? 1 : 0, Math.min(1, dt * 2.2));
      const sp = U * 0.95 * w.base * tempo * w.v;
      w.y += w.dir * sp * dt;
      w.x += w.dir * w.drift * sp * dt;
      w.phase += dt * 6.2 * w.base * tempo * w.v;
      w.hover = lerp(w.hover, w === hovered ? 1 : 0, Math.min(1, dt * 9));
      w.spin += dt * w.hover * 0.9;
      if (w.bloom < 1) w.bloom = Math.min(1, w.bloom + dt * 2.2);
      const m = 2.4 * U;
      if (w.y < -m * 0.3) { w.y = H + m * 0.9; w.x = rnd(U * 0.5, W - U * 0.5); }
      if (w.y > H + m) { w.y = -m * 0.2; w.x = rnd(U * 0.5, W - U * 0.5); }
      if (w.x < -U) w.x = W + U * 0.5; if (w.x > W + U) w.x = -U * 0.5;
      if (w.v > 0.5 && Math.random() < dt * 0.035) {
        const h = headPos(w); burst(h.x, h.y, h.r, w.flower.pal, 1);
      }
    }

    walkers.sort((a, b) => a.y - b.y).forEach(drawWalker);

    if (hovered) {
      const h = headPos(hovered);
      const label = hovered.flower.type.name;
      ctx.font = '500 12px "DM Mono", ui-monospace, monospace';
      const tw = ctx.measureText(label).width + 18;
      let lx = h.x - tw / 2, ly = h.y - h.r * 1.35 - 26;
      lx = Math.max(8, Math.min(W - tw - 8, lx)); ly = Math.max(8, ly);
      ctx.fillStyle = 'rgba(18,20,20,0.82)';
      ctx.beginPath(); ctx.roundRect(lx, ly, tw, 22, 11); ctx.fill();
      ctx.fillStyle = '#f3f1ea'; ctx.textBaseline = 'middle';
      ctx.fillText(label, lx + 9, ly + 11.5);
    }

    drawWires();
    drawRain(dt);
    requestAnimationFrame(frame);
  }

  // ---------- Eingaben ----------
  function setPointer(e) { const r = cv.getBoundingClientRect(); pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; }
  cv.addEventListener('pointermove', setPointer);
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointer.x = pointer.y = -1e4; });
  cv.addEventListener('pointerdown', e => {
    setPointer(e);
    const w = findWalker(pointer.x, pointer.y);
    if (w) {
      const h = headPos(w);
      burst(h.x, h.y, h.r, w.flower.pal, 16);
      w.flower = newFlower(w.flower.type.key);
      w.bloom = 0.15;
    } else {
      const nw = newWalker(pointer.x, pointer.y + 1.72 * U);
      nw.bloom = 0; nw.v = 0;
      walkers.push(nw);
      if (walkers.length > 70) walkers.shift();
      burst(pointer.x, pointer.y, U * 0.5, nw.flower.pal, 6);
    }
    if (e.pointerType !== 'mouse') setTimeout(() => { pointer.x = pointer.y = -1e4; }, 900);
    updateCount();
  });

  const lightBtn = document.getElementById('light');
  function toggleLight() {
    green = !green;
    lightBtn.classList.toggle('red', !green);
    lightBtn.setAttribute('aria-pressed', String(!green));
    document.getElementById('lightLabel').textContent = green ? 'Ampel: Grün' : 'Ampel: Rot';
  }
  lightBtn.addEventListener('click', toggleLight);
  addEventListener('keydown', e => {
    if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); toggleLight(); }
  });

  const rainBtn = document.getElementById('rain');
  rainBtn.addEventListener('click', () => { raining = !raining; rainBtn.setAttribute('aria-pressed', String(raining)); rainBtn.textContent = raining ? 'Regen an' : 'Regen'; });

  const tempoInput = document.getElementById('tempo');
  tempoInput.value = tempo;
  tempoInput.addEventListener('input', () => { tempo = parseFloat(tempoInput.value); });

  document.getElementById('rebloom').addEventListener('click', () => {
    walkers.forEach((w, i) => setTimeout(() => {
      const h = headPos(w); burst(h.x, h.y, h.r, w.flower.pal, 8);
      w.flower = newFlower(w.flower.type.key); w.bloom = 0.1; updateCount();
    }, i * 45));
  });

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
